# CI/CD de Yumori. Guía: docs/operations/ci-cd.md
#
# - En cada pull request y en cada push a master corren las pruebas (jobs `python` y `frontend`).
# - Solo en un push a master, y solo si la variable del repositorio AWS_DEPLOY_ROLE_ARN existe, el job `deploy`
#   actualiza la EC2 con AWS Systems Manager (sin SSH, sin puertos abiertos, sin llaves de AWS en GitHub).
#
# Los nombres de los jobs (`python`, `frontend`) son los que se exigen como "status checks" en la protección de master.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Principio de mínimo privilegio: el token de GitHub solo lee el código. El job `deploy` pide además id-token.
permissions:
  contents: read

# Una ejecución por rama o pull request. Se cancela la anterior solo en pull requests: nunca se cancela una de master,
# porque podría ser un despliegue a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"  # la misma versión que el Dockerfile
      # tests/test_favorites.py ejecuta `node`: tiene que estar en el PATH. Python no instala nada (ADR-001).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Pruebas de Python
        run: python tests/run.py
      # Un Caddyfile inválido dejaría el sitio sin proxy al desplegar.
      - name: Validar el Caddyfile
        run: docker run --rm -e YUMORI_DOMAIN=yumori.cl -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"  # la misma versión que frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # El e2e HTTP (tests/next_pilot_e2e.py) usa solo la stdlib de Python.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Pruebas de Node
        working-directory: frontend
        run: npm test
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Build de Next
        working-directory: frontend
        run: npm run build
      # Necesita frontend/node_modules y frontend/.next/BUILD_ID (los deja el paso anterior); encuentra Node con shutil.which.
      - name: Paridad HTTP de Next con la API (e2e)
        run: python tests/next_pilot_e2e.py

  deploy:
    name: deploy
    needs: [python, frontend]
    # Se omite (no falla) mientras no exista la variable: el CI funciona antes de configurar AWS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25  # un build de Next en una EC2 chica puede tardar varios minutos
    permissions:
      id-token: write  # pedir el token OIDC que AWS intercambia por credenciales temporales
      contents: read
    # Un solo despliegue a la vez; uno en curso nunca se cancela, el siguiente espera.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Desplegar en la EC2 con SSM
        shell: bash
        env:
          # Todo lo que entra al script pasa por variables de entorno, nunca interpolado en el texto del script.
          SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA con formato inesperado"
            exit 1
          fi

          # Script remoto. SSM lo corre como root; git se niega a trabajar en un repositorio de otro usuario,
          # así que se ejecuta como `ubuntu`. Sin comillas simples dentro: se envuelve entre comillas simples.
          # Solo se pisa el código con `git reset --hard`: .env y data/ no están versionados y no se tocan (nunca git clean).
          REMOTE='set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA invalido"; exit 1; }
          cd /home/ubuntu/yumori
          git fetch --prune origin
          OLD=$(git rev-parse HEAD)
          git reset --hard "$SHA"
          docker compose pull caddy
          docker compose build --pull
          docker compose up -d
          # El Caddyfile va montado como archivo suelto: git lo reemplaza y el contenedor sigue con el viejo. Si cambió, se valida
          # en un contenedor aparte (sin puertos) y solo entonces se reinicia Caddy; si no es válido, se corta aquí y sigue el anterior.
          if ! git diff --quiet "$OLD" "$SHA" -- Caddyfile; then
            docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose restart caddy
          fi
          docker image prune -f
          docker compose ps'
          # El SHA ya se validó (40 hex): es seguro ponerlo en la línea de comandos.
          COMMAND="sudo -u ubuntu -H env SHA=${SHA} bash -lc '${REMOTE}'"

          # jq arma el JSON de parámetros con el escapado correcto.
          jq -n --arg c "$COMMAND" '{commands: [$c], executionTimeout: ["1200"]}' > "$RUNNER_TEMP/ssm-params.json"

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy ${SHA:0:12} (run ${GITHUB_RUN_ID})" \
            --timeout-seconds 120 \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM CommandId: $COMMAND_ID"

          # Se consulta a mano en vez de `aws ssm wait command-executed`: ese waiter se rinde a los pocos minutos
          # (por defecto, unos 100 s según recuerdo, no verificado) y un build de Next puede tardar más.
          deadline=$((SECONDS + 1320))
          status="Pending"
          while true; do
            # Justo después de enviar, la invocación puede no existir todavía: ese error se tolera y se reintenta.
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text) || status="Pending"
            echo "Estado: $status"
            case "$status" in
              Pending|InProgress|Delayed|Cancelling) ;;
              *) break ;;
            esac
            if (( SECONDS >= deadline )); then
              status="SinRespuestaAntesDelLimite"
              break
            fi
            sleep 10
          done

          # Se imprime siempre la salida, haya salido bien o mal.
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --output json > "$RUNNER_TEMP/ssm-result.json" || true
          echo "::group::Salida estándar del servidor"
          jq -r '.StandardOutputContent // empty' "$RUNNER_TEMP/ssm-result.json" || true
          echo "::endgroup::"
          echo "::group::Error estándar del servidor"
          jq -r '.StandardErrorContent // empty' "$RUNNER_TEMP/ssm-result.json" || true
          echo "::endgroup::"

          if [ "$status" != "Success" ]; then
            echo "::error::El despliegue terminó con estado: $status (CommandId $COMMAND_ID)"
            exit 1
          fi

      - name: Comprobar que el sitio responde
        run: curl -fsS --max-time 20 --retry 10 --retry-delay 6 --retry-all-errors https://yumori.cl/robots.txt
